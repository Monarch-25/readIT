<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Novel Reader — Player</title>
  <link rel="stylesheet" href="player.css" />
</head>
<body>
  <div class="readbar" aria-hidden="true"><div class="fill" id="progressFill"></div></div>

  <header class="masthead">
    <div class="wordmark">
      <h1>Novel Reader</h1>
      <div class="themes" id="themes" title="Color theme"></div>
    </div>
    <div class="runhead">
      <span class="src" id="sourceName">untitled</span>
      <span class="voice" id="voiceName">no voice</span>
    </div>
  </header>

  <main>
    <section class="voiceset" aria-label="Voice settings">
      <label class="pick">Voice
        <select id="voiceSel" aria-label="Voice"></select>
      </label>
      <label class="pick">Style
        <select id="styleSel" aria-label="Reading style"></select>
      </label>
      <label class="pick">Language
        <select id="langSel" aria-label="Language">
          <option value="English" selected>English</option>
          <option value="auto">auto</option>
          <option value="Chinese">Chinese</option>
          <option value="Japanese">Japanese</option>
          <option value="Korean">Korean</option>
          <option value="German">German</option>
          <option value="French">French</option>
          <option value="Russian">Russian</option>
          <option value="Portuguese">Portuguese</option>
          <option value="Spanish">Spanish</option>
          <option value="Italian">Italian</option>
        </select>
      </label>
      <div class="srv">
        <span class="srvdot" id="srvDot"></span>
        <span class="srvtext" id="srvText">finding the voice…</span>
        <button class="srvbtn" id="srvBtn" hidden>Start</button>
        <button class="srvlink" id="customLink">custom server…</button>
      </div>
      <div class="customrow" id="customRow" hidden>
        <input id="endpoint" type="text" placeholder="http://127.0.0.1:8901" spellcheck="false" aria-label="Custom server endpoint" />
        <button id="probe" class="srvbtn">Connect</button>
      </div>
    </section>

    <section class="hero" id="nowCard">
      <p class="ctx" id="nowPrev"></p>
      <p class="thesis" id="now">Paste your chapter below — or open a file — and I will read it aloud.</p>
      <p class="ctx" id="nowNext"></p>
      <div class="heromargin"><span id="progress">– / –</span></div>
    </section>

    <canvas class="voiceprint" id="voice" height="44" title="The voice, live"></canvas>

    <p class="stateline" id="state">Ready</p>
    <p class="msgline" id="status"></p>

    <section class="source" id="source">
      <button class="sourceline" id="sourceLine" hidden>
        <span id="sourceLineName">untitled</span>
        <span class="sep">—</span>
        <span id="sourceLineCount">0 words</span>
        <span class="replace">Replace</span>
      </button>
      <div class="sourcebody" id="sourceBody">
        <textarea id="text" rows="6" placeholder="Paste the chapter you want read aloud…"></textarea>
        <div class="srcrow">
          <label class="filebtn" for="file">Open a file</label>
          <input type="file" id="file" accept=".txt,.md,.text,text/plain,text/markdown" hidden />
          <button class="quietbtn" id="clear">Clear</button>
          <span class="hint">.txt or .md, up to 5 MB — or drop one anywhere here</span>
          <span class="count" id="charCount">0 chars</span>
        </div>
      </div>
    </section>

    <div class="asterism" aria-hidden="true">⁂</div>

    <section class="chapter">
      <div class="page" id="transcript">
        <p class="invitation">Your chapter will appear here when you press Play — follow along as each sentence is read.</p>
      </div>
      <div class="chapterfoot">
        <label class="followtoggle"><input type="checkbox" id="follow" checked /> Follow along</label>
      </div>
    </section>
  </main>

  <footer class="rail">
    <button id="play" class="go" title="Start / restart reading">Play</button>
    <button id="pause" class="verb" title="Pause" disabled>Pause</button>
    <button id="stop" class="verb" title="Stop" disabled>Stop</button>
    <select id="speed" title="Playback speed" aria-label="Playback speed">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.15">1.15×</option>
      <option value="1.3">1.3×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option>
      <option value="2">2×</option>
    </select>
  </footer>

  <script src="../lib/chunker.js"></script>
  <script src="../lib/ttsapi.js"></script>
  <script src="player.js"></script>
</body>
</html>
